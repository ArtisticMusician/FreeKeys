<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobius - Premium 8-Track Loop Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="app-container">

    <!-- Top Bar / Header -->
    <header id="app-header" class="header-footer-bar">
        <div class="logo-area">
            <h1>&#x221E; mobius</h1>
        </div>
        <div class="global-controls">
            <button id="toggle-mixer-btn" class="btn">Mixer</button>
            <button id="swap-layout-btn" class="btn">Swap Top/Bottom</button>
        </div>
    </header>

    <!-- Toolbar -->
    <div id="toolbar" class="toolbar">
        <div class="tool-group">
            <button class="tool-btn active" title="Select Tool">Arrow</button>
            <button class="tool-btn" title="Razor Tool">Razor</button>
            <button class="tool-btn" title="Time Warp">Warp</button>
            <button class="tool-btn" title="Mute Tool">Mute</button>
            <button class="tool-btn" title="Glue Tool">Glue</button>
        </div>
        <div class="tool-group">
            <button class="tool-btn snap-btn active" title="Snap to Grid">Snap</button>
            <select class="grid-res-select" title="Grid Resolution">
                <option value="1">1 Bar</option>
                <option value="1/4">1/4</option>
                <option value="1/8">1/8</option>
                <option value="1/16" selected>1/16</option>
                <option value="1/32">1/32</option>
            </select>
        </div>
        <div class="tool-group swing-controls">
            <span>Swing:</span>
            <select class="swing-type">
                <option value="8th">8th</option>
                <option value="16th">16th</option>
            </select>
            <input type="range" min="0" max="100" value="0" class="swing-amount">
        </div>
        <div class="tool-group">
            <button class="tool-btn metronome-btn" title="Metronome">Click</button>
        </div>
    </div>

    <!-- Main Workspace -->
    <main id="app-main" class="workspace">

        <!-- Left Panel: Sample Browser (Drag & Drop source) -->
        <aside class="sample-browser">
            <div class="browser-header">Browser</div>
            <div class="browser-list">
                <div class="browser-item" draggable="true">Bass_Loop_01.wav</div>
                <div class="browser-item" draggable="true">Drum_Break_120.wav</div>
                <div class="browser-item" draggable="true">Synth_Chords_Am.wav</div>
                <div class="browser-item" draggable="true">Vocal_Chop_04.wav</div>
                <div class="browser-item" draggable="true">FX_Riser_Long.wav</div>
                <div class="browser-item" draggable="true">Perc_Loop_Top.wav</div>
            </div>
        </aside>

        <!-- Right Panel: Arrange View -->
        <section class="arrange-view">
            <!-- Timeline Ruler -->
            <div class="timeline-ruler-container">
                <div class="ruler-spacer"></div> <!-- Spacer for track headers -->
                <div class="timeline-ruler">
                    <div class="loop-region-marker"></div>
                    <!-- Ruler ticks and Tag markers generated by JS -->
                    <div class="ruler-content" id="ruler-content"></div>
                </div>
            </div>

            <!-- Tracks Area -->
            <div class="tracks-area-scroll">
                <div class="tracks-container" id="tracks-container">
                    <!-- Tracks generated by JS -->
                </div>
                <!-- Global Playhead overlay -->
                <div class="playhead" id="global-playhead">
                    <div class="playhead-triangle"></div>
                    <div class="playhead-line"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- Bottom Bar / Footer (Transport) -->
    <footer id="app-footer" class="header-footer-bar transport-bar">
        <div class="transport-controls">
            <button class="transport-btn stop-btn" title="Stop">&#9632;</button>
            <button class="transport-btn play-btn" title="Play">&#9654;</button>
            <button class="transport-btn loop-btn" title="Toggle Looping">&#x21BB;</button>
        </div>
        <div class="tempo-control">
            <span class="tempo-label">Tempo</span>
            <input type="number" class="tempo-input" value="120" min="20" max="300">
        </div>
        <div class="time-displays">
            <div class="time-display time-mode" id="time-display-time">00:00:00.000</div>
            <div class="time-display bars-mode" id="time-display-bars">001:01:000</div>
        </div>
    </footer>

    <!-- Floating Mixer Section -->
    <div id="mixer-panel" class="floating-mixer hidden">
        <div class="mixer-header">
            <h3>Mixer</h3>
            <button id="close-mixer-btn" class="close-btn">&times;</button>
        </div>
        <div class="mixer-channels" id="mixer-channels">
            <!-- Channels and Master Bus generated by JS -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
